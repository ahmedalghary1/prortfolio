{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}منشئ البورتفوليو{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'portfolios/bootstrap.css' %}">
  <link rel="stylesheet" href="{% static 'portfolios/app.css' %}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}"><span class="text-info">Portfolio</span> Studio</a>
    <div class="d-flex align-items-center gap-3">
      {% if user.is_authenticated %}
        <a class="text-white text-decoration-none" href="{% url 'dashboard' %}">لوحة التحكم</a>
        <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-sm btn-outline-light" type="submit">خروج</button></form>
      {% else %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">دخول</a>
        <a class="btn btn-sm btn-info" href="{% url 'signup' %}">إنشاء حساب</a>
      {% endif %}
    </div>
  </div>
</nav>
{% block content %}{% endblock %}
<script src="{% static 'portfolios/bootstrap.js' %}"></script>
</body>
</html>
