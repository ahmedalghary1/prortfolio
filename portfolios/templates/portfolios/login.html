{% extends 'portfolios/base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<main class="container py-5"><div class="card border-0 shadow-sm form-card mx-auto"><div class="card-body p-4 p-md-5">
  <h1 class="h3 fw-bold mb-4">تسجيل الدخول</h1>
  <form method="post">{% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">اسم المستخدم</label><input class="form-control" type="text" name="username" id="id_username" required autofocus value="{{ form.username.value|default:'' }}"></div>
    <div class="mb-4"><label class="form-label" for="id_password">كلمة المرور</label><input class="form-control" type="password" name="password" id="id_password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">دخول</button>
  </form>
  <p class="mt-4 mb-0 text-secondary">ليس لديك حساب؟ <a href="{% url 'signup' %}">أنشئ حسابًا</a></p>
</div></div></main>
{% endblock %}
